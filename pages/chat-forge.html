<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbibden</title>
    <meta name="description" content="403 Forbibden: Test edilmiş AI prompt kütüphanesi ve kişiselleştirilebilir Chatlog görselleştirme aracı.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/image/favicon.svg" />
    <style>
        :root {
            --bg-body: #191b1f;       
            --bg-panel: #202328;
            --bg-input: #262a30;
            --text-main: #e1e3e6;
            --text-muted: #8a8d91;
            --accent: #5b89ff;
            --border: #2f333a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .brand { font-weight: 600; font-size: 1rem; color: white; display: flex; gap: 8px; align-items: center; }
        .brand i { color: var(--accent); }

        .btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex; align-items: center; gap: 6px;
            transition: 0.2s;
        }
        .btn:hover { background: #333; }
        .btn.primary { background: var(--accent); color: white; border:none; }
        .btn.primary:hover { background: #4a72d6; }

        .layout {
            display: flex;
            height: calc(100vh - 90px);
        }

        .editor-pane {
            width: 40%;
            min-width: 350px;
            background: var(--bg-body);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .toolbar {
            display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;
        }
        .color-palette-container {
            display: flex;
            align-items: center;
            gap: 8px; 
            background: var(--bg-input); 
            padding: 5px 10px; 
            border-radius: 20px; 
            border: 1px solid var(--border);
            margin-left: auto; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); 
        }


        .color-btn {
            width: 20px; 
            height: 20px; 
            border-radius: 50%; 
            cursor: pointer;
            border: 2px solid rgba(30, 30, 30, 0.5); 
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); 
            position: relative;
        }

        .color-btn:hover {
            transform: scale(1.25) translateY(-2px); 
            border-color: white; 
            box-shadow: 0 5px 10px rgba(0,0,0,0.3); 
            z-index: 2; 
        }
        .chip {
            background: var(--bg-input);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            border: 1px solid transparent;
            display: flex; align-items: center; gap: 5px;
        }
        .chip:hover { border-color: var(--text-muted); color: white; }

        .color-palette {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .color-btn {
            width: 18px; 
            height: 18px; 
            border-radius: 4px; 
            cursor: pointer;
            border: 1px solid #444; 
            transition: transform 0.1s;
        }
        .color-btn:hover { transform: scale(1.1); border-color: white; }
        
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            resize: none;
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.5;
            font-family: 'Inter', sans-serif;
            margin-top: 10px;
        }

        .preview-pane {
            flex: 1;
            background: #111;
            background-image: linear-gradient(45deg, #151515 25%, transparent 25%), linear-gradient(-45deg, #151515 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #151515 75%), linear-gradient(-45deg, transparent 75%, #151515 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex;
            justify-content: center;
            overflow-y: auto;
            padding: 40px;
        }

        .canvas-wrapper {
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        
        canvas { display: block; }

        .settings-bar {
            display: flex; gap: 15px; padding-top: 10px; border-top: 1px solid var(--border);
            font-size: 0.8rem; color: var(--text-muted); align-items: center;
        }
        input[type="number"] { background: var(--bg-input); border:1px solid var(--border); color:white; padding:2px 5px; width:40px; border-radius:4px; }

        #toast-box { position: fixed; bottom: 20px; right: 20px; z-index: 99; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #333; color: white; padding: 10px 15px; border-radius: 6px; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: fade 0.3s; display: flex; gap: 8px; align-items: center;}
    
        @keyframes fade { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
        footer {
    height: 40px; /* İnce ve zarif */
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 0.8rem;
    color: var(--text-muted);
    user-select: none; 
}

.footer-left, .footer-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.social-link {
    color: var(--text-muted);
    transition: 0.2s;
    text-decoration: none;
    font-size: 1rem;
    display: flex;
    align-items: center;
}

.social-link:hover {
    color: var(--accent);
    transform: translateY(-2px); 
}

.version-badge {
    background: var(--bg-input);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    font-size: 0.7rem;
    font-family: monospace;
}
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="brand" style="text-decoration: none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
                <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" fill="#262a30" stroke="#e1e3e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M11 6L14 10H10L13 14" stroke="#5b89ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            ChatForge
        </a>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="inputFolder" placeholder="Dosya adı..." style="background:transparent; border:none; border-bottom:1px solid #444; color:#aaa; text-align:right;">
            <button class="btn" onclick="DownloadTxtFunction()"><i class="fa-solid fa-file-export"></i> TXT</button>
            <button class="btn primary" onclick="DownloadPngFunction()"><i class="fa-solid fa-download"></i> PNG</button>
        </div>
    </header>

    <div class="layout">
        <div class="editor-pane">
           <div class="toolbar">
            <div class="chip" onclick="cleanTimestamps()"><i class="fa-regular fa-clock"></i> Saat Filtrele</div>
            <div class="chip" onclick="cleanOOC()"><i class="fa-solid fa-ban"></i> OOC Filtrele</div>
            <div class="chip" onclick="insertTag('#C2A2DA')">🟣 Emote</div>
            <div class="chip" onclick="insertTag('#FFFFFF')">⚪ Text</div>
            
            <div class="color-palette-container" id="colorMenu">
                <button class="color-btn" style="background-color: #56d64b;" onclick="applyColorTag('#56d64b')"></button>
                <button class="color-btn" style="background-color: #eda841;" onclick="applyColorTag('#eda841')"></button>
                <button class="color-btn" style="background-color: #3896f3;" onclick="applyColorTag('#3896f3')"></button>
                <button class="color-btn" style="background-color: #f00000;" onclick="applyColorTag('#f00000')"></button>
                <button class="color-btn" style="background-color: #ffff06;" onclick="applyColorTag('#ffff06')"></button>
                <button class="color-btn" style="background-color: #939799;" onclick="applyColorTag('#939799')"></button>
                <button class="color-btn" style="background-color: #5a5a5b;" onclick="applyColorTag('#5a5a5b')"></button>
                <button class="color-btn" style="background-color: #c6c4c4;" onclick="applyColorTag('#c6c4c4')"></button>
                <button class="color-btn" style="background-color: #ffec8b;" onclick="applyColorTag('#ffec8b')"></button>
                <button class="color-btn" style="background-color: #a19558;" onclick="applyColorTag('#a19558')"></button>
                <button class="color-btn" style="background-color: #ccca15;" onclick="applyColorTag('#ccca15')"></button>
                <button class="color-btn" style="background-color: #33c1c9;" onclick="applyColorTag('#33c1c9')"></button>
            </div>
        </div>

            <textarea id="inputText" spellcheck="false" placeholder="Metni buraya yapıştır...
            
    Örnek:
    * Valentina Ramirez elindeki bardağı masaya bırakır.
    [02:50:57] Valentina Ramirez: Hnm-m!{#C2A2DA} gülümser. !{#FFFFFF}Harika bir fikir.
    !{#56d64b} 400$ verdin.
            "
>

</textarea>
            
        <div class="settings-bar">
                <span>Font: <input type="number" id="inputSize" value="13" min="10" max="40"> px</span>
                <span>Genişlik: <input type="number" id="inputWidth" value="800" min="400" max="1920" step="50" style="width:60px"> px</span>
                <span>Arka Plan: <select id="bgSelect">
                <option value="#000000">Siyah</option>
                <option value="transparent">Şeffaf</option>
                </select></span>
                <span id="charCount" style="margin-left: auto;">0 Karakter</span>
                
            </div>
        </div>

        <div class="preview-pane">
            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <div id="toast-box"></div>

<script>
    var fontSize = 13;
    var canvasWidth = 800;
    var fontFamily = 'Arial';
    var bgColor = '#000000'; 
    var strokeColor = '#000000';
    var padding = 20;

    const textArea = document.getElementById('inputText');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('inputFolder').value = `log_${new Date().toISOString().slice(0,10)}`;
        drawCanvas();
    });

    textArea.addEventListener('input', () => {
        document.getElementById('charCount').innerText = textArea.value.length;
        drawCanvas();
    });

    document.getElementById('inputSize').addEventListener('input', (e) => {
        fontSize = parseInt(e.target.value);
        drawCanvas();
    });
    
    document.getElementById('bgSelect').addEventListener('change', (e) => {
        bgColor = e.target.value;
        drawCanvas();
    });

    function drawCanvas() {
        const text = textArea.value;
        const lines = text.split('\n');
        const lineHeight = fontSize * 1.5;
        
        ctx.font = `bold ${fontSize}px ${fontFamily}, sans-serif`;

        let renderQueue = [];
        let cursorY = padding;
       

        lines.forEach(line => {
            let defaultLineColor = '#FFFFFF';
            if (line.trim().startsWith('*') || line.trim().startsWith('>')) {
                defaultLineColor = '#C2A2DA';
            }
            let segments = parseCustomTags(line, defaultLineColor);
            
            let cursorX = padding;
            let maxLineWidth = canvasWidth - (padding * 2);

            segments.forEach(seg => {
                let words = seg.text.split(/(\s+)/); 

                words.forEach(word => {
                    let wordWidth = ctx.measureText(word).width;

                    if (cursorX + wordWidth > maxLineWidth && cursorX > padding) {
                        cursorX = padding;
                        cursorY += lineHeight;
                    }

                    renderQueue.push({
                        text: word,
                        x: cursorX,
                        y: cursorY,
                        color: seg.color
                    });

                    cursorX += wordWidth;
                });
            });

            cursorY += lineHeight;
        });
        
        if(bgColor !== "transparent"){
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        canvas.width = canvasWidth;
        canvas.height = Math.max(cursorY + padding, 100);

        ctx.font = `bold ${fontSize}px ${fontFamily}, sans-serif`;
        ctx.textBaseline = 'top';
        ctx.lineWidth = 3; 
        ctx.strokeStyle = strokeColor;

        renderQueue.forEach(item => {
            ctx.fillStyle = item.color;
            ctx.strokeText(item.text, item.x, item.y);
            ctx.fillText(item.text, item.x, item.y);
        });

        
    }

    function parseCustomTags(line, startColor) {
        let currentColor = startColor; 
        
        const regex = /(!\{#[0-9A-Fa-f]{6}\})/g; 
        
        const parts = line.split(regex);
        const result = [];

        parts.forEach(part => {
            if (part.match(/^!\{#[0-9A-Fa-f]{6}\}$/)) {
                currentColor = part.substring(2, 9); 
            } else if (part.length > 0) {
                result.push({ text: part, color: currentColor });
            }
        });

        return result;
    }

    function cleanTimestamps() {
        let txt = textArea.value;
        textArea.value = txt.replace(/^\[\d{2}:\d{2}:\d{2}\]\s*/gm, '');
        drawCanvas();
        showToast('Saatler temizlendi.');
    }

    function cleanOOC() {
        let lines = textArea.value.split('\n');
        textArea.value = lines.filter(l => !l.includes('((')).join('\n');
        drawCanvas();
        showToast('OOC satırlar silindi.');
    }

    function insertTag(color) {
        let tag = `!{${color}}`;
        let start = textArea.selectionStart;
        let end = textArea.selectionEnd;
        let text = textArea.value;
        textArea.value = text.substring(0, start) + tag + text.substring(end);
        drawCanvas();
        textArea.focus();
    }

    function applyColorTag(color) {
        let tag = `!{${color}}`;
        let start = textArea.selectionStart;
        let end = textArea.selectionEnd;
        if(start === end) {
            insertTag(color);
            return;
        }
        let text = textArea.value;
        let replacement = `!{${color}}${text.substring(start, end)}!{#FFFFFF}`;
        textArea.setRangeText(replacement);
        drawCanvas();
    }

    function DownloadPngFunction() {
        if(!textArea.value.trim()) return showToast('Boş!');
        const link = document.createElement('a');
        link.download = (document.getElementById('inputFolder').value || 'rp_log') + '.png';
        link.href = canvas.toDataURL();
        link.click();
        showToast('PNG İndirildi');
    }
    
    function DownloadTxtFunction() {
        const blob = new Blob([textArea.value], {type:'text/plain'});
        const link = document.createElement('a');
        link.download = (document.getElementById('inputFolder').value || 'rp_log') + '.txt';
        link.href = URL.createObjectURL(blob);
        link.click();
    }

    function showToast(msg) {
        const box = document.getElementById('toast-box');
        const div = document.createElement('div');
        div.className = 'toast';
        div.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${msg}`;
        box.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }
</script>

        <span>403 Forbibden</span>

        <span style="opacity: 0.3">|</span>
        
        <span class="version-badge">v1.2.0</span>
    </div>
</footer>
</body>
